[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeigen-bot"
version = "0.8.0"
description = "Persistent-profile apartment search assistant"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.49,<2", "pydantic>=2.9,<3", "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7", "python-telegram-bot>=22,<23", "APScheduler>=3.10,<4",
  "structlog>=24,<27", "filelock>=4.2.1,<5",
  "httpx>=0.27,<0.29", "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
browser = ["patchright>=1.64.3,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "coverage>=7,<8"]

[project.scripts]
kleinbot = "kleinanzeigen_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kleinanzeigen_bot = ["state/schema.sql", "demo/listings.json", "demo/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
